<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABAPLINT Playground</title>
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16" />
  <!-- 预加载关键资源 -->
  <link rel="preconnect" href="https://maxcdn.bootstrapcdn.com">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-83119203-1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'UA-83119203-1');
  </script>
  <style>
    /* 加载指示器 */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1e1e1e;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #loading.hidden {
      display: none;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #333;
      border-top-color: #007acc;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 15px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- 加载指示器 -->
  <div id="loading">
    <div class="spinner"></div>
    <span>Loading ABAPLINT Playground...</span>
  </div>
  
  <script>
    // Monaco Editor Worker 配置
    self.MonacoEnvironment = {
      getWorkerUrl: function(moduleId, label) {
        const base = document.querySelector('script[src*="app"]')?.src?.replace(/app[^/]*\.js.*$/, '') || '/-abaplint/';
        if (label === 'json') {
          return base + 'json.worker.bundle.js';
        }
        return base + 'editor.worker.bundle.js';
      }
    };
    
    // 隐藏加载指示器
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('loading').classList.add('hidden');
      }, 100);
    });
  </script>
</body>
</html>
