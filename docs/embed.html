<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABAPLINT Playground - 自定义版</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #1e1e1e;
      color: #fff;
      min-height: 100vh;
    }
    
    .container {
      width: 100%;
      height: 100vh;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 嵌入自定义 playground -->
    <iframe 
      src="./playground/index.html" 
      title="ABAPLINT Playground"
      allow="clipboard-read; clipboard-write">
    </iframe>
  </div>
</body>
</html>
